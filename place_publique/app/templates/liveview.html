{% extends 'base.html' %}
{% block content %}
<h3>LiveView</h3>
<div class="row g-3">
  <div class="col-md-4">
    <select id="camera" class="form-select">
      {% for c in cameras %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
    </select>
    <div class="mt-2 d-flex gap-2">
      <button class="btn btn-success" onclick="startStream()">Start</button>
      <button class="btn btn-secondary" onclick="stopStream()">Stop</button>
      <button class="btn btn-warning" onclick="lowPower()">Low power</button>
    </div>
  </div>
</div>
<div class="mt-3 card"><div class="card-body text-center">
  <img id="liveimg" style="max-width:100%;" />
</div></div>
<script>
function startStream(){
  const cam = document.getElementById('camera').value;
  document.getElementById('liveimg').src = `/live/${cam}.mjpg?t=${Date.now()}`;
}
function stopStream(){ document.getElementById('liveimg').src = ''; }
function lowPower(){
  const cam = document.getElementById('camera').value;
  document.getElementById('liveimg').src = `/live/${cam}.mjpg?fps=1&t=${Date.now()}`;
}
</script>
{% endblock %}
